<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./vue.js"></script>
    <title>Document</title>
</head>
<body>
    <div id="app">
        Soma: {{ somar() }} <br>
        Subtração: {{ subtrair() }} <br>
        Multiplicação: {{ multiplicar() }} <br>
        Divisão: {{ dividir() }}
    </div> 

    <script>
        const vm = new Vue({
            el:'#app', 
            data: {},
            methods: {
                somar: function somar() { // sintaxe convencional (função nomeada)
                    return 12 + 6;
                },
                subtrair: function(){ // função anônima
                    return 12 - 6;
                },
                multiplicar: () => { // arrow function
                    return 12 * 6;
                },
                dividir() { // método abreviado
                    return 12 / 6;
                }
            } 
        }); 
    </script>
</body>
</html>
